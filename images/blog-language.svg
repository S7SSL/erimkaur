<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF4EA"/>
      <stop offset="100%" stop-color="#E8DAC0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#6E1E2C" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <!-- decorative ribbon top-right -->
  <circle cx="1450" cy="-50" r="280" fill="#6E1E2C" fill-opacity="0.06"/>
  <circle cx="1450" cy="-50" r="180" fill="#6E1E2C" fill-opacity="0.05"/>
  
  <!-- icon -->
  <g transform="translate(800, 360)" stroke="#6E1E2C" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="scale(2) translate(-40, -45)"><path d="M20 30 Q12 30, 12 38 V52 Q12 60, 20 60 H30 V46 H22 Q22 38, 30 38 Z" fill="#6E1E2C" fill-opacity="0.18"/><path d="M50 30 Q42 30, 42 38 V52 Q42 60, 50 60 H60 V46 H52 Q52 38, 60 38 Z" fill="#6E1E2C" fill-opacity="0.18"/><path d="M20 30 Q12 30, 12 38 V52 Q12 60, 20 60 H30 V46 H22 Q22 38, 30 38 Z M50 30 Q42 30, 42 38 V52 Q42 60, 50 60 H60 V46 H52 Q52 38, 60 38 Z"/></g>
  </g>
  <!-- italic label -->
  <text x="800" y="650" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="68" fill="#2D0B12" font-weight="500">From Sorry to Certain</text>
  <!-- small under-text -->
  <text x="800" y="730" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="32" fill="#6E1E2C" font-weight="400" letter-spacing="3">erim kaur</text>
</svg>